services:
  arxivist:
    build: .
    container_name: arxivist
    restart: unless-stopped

    # Bind ONLY to localhost so the port is not exposed to the internet.
    # nginx on the host proxies /arxivist/ → 127.0.0.1:5050 (Flask app).
    # The bridge runs in-container on 127.0.0.1:9999; nothing outside the
    # container needs to reach it.
    ports:
      - "127.0.0.1:5050:5050"
      # Also expose on :5000 so the HH OAuth callback registered as
      # http://localhost:5000/hh/callback resolves during local testing.
      # (Same container port; only the /hh/callback route is hit this way.)
      - "127.0.0.1:5000:5050"

    # .env in the project root supplies secrets (ANTHROPIC_AUTH_TOKEN,
    # PROXY_AUTH_TOKEN, PROXY_STREAM_URL_TEMPLATE, etc.).
    env_file:
      - .env

    environment:
      # Tells Flask/index.html the sub-path prefix nginx strips before forwarding.
      - APP_BASE=/arxivist
      # The Anthropic SDK + bundled CLI both point at the local bridge.
      - ANTHROPIC_BASE_URL=http://127.0.0.1:9999
      # Bridge config — points it at the real upstream proxy.
      # PROXY_UPSTREAM_URL, PROXY_AUTH_TOKEN, PROXY_STREAM_URL_TEMPLATE come from .env.

    volumes:
      # Bind-mount everything to the project tree so contents are visible on the
      # host and `git pull` immediately updates skills inside the container.
      # Files written by the container will be root-owned on Linux — use sudo
      # to delete or `chown -R $USER:$USER <dir>` after a session to clean up.
      - ./downloads:/app/downloads
      - ./.claude/skills:/app/.claude/skills
      - ./uploads:/app/uploads
      - ./dashboards:/app/dashboards
      # API agent jobs (request/status/events per job) survive restarts.
      - ./jobs:/app/jobs
      # Persists bridge mode preference (direct/proxy) across container restarts.
      - ./config:/app/config

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
